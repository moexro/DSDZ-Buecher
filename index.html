<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alle digitalen Schulbücher der Klassen 9 bis 12 auf einen Blick." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#294563" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23294563'/%3E%3Cpath d='M6 9h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H6zM26 9h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z' fill='none' stroke='%23e6ecf1' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css?v=3" />
    <title>DSDZ-Bücher</title>
  </head>

  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <button class="brand" id="brand" type="button" aria-label="DSDZ-Bücher – zur Klassenübersicht">
          <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z" /><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z" /></svg>
          </span>
          <span class="brand-name">DSDZ-Bücher</span>
        </button>

        <nav class="grade-switch" aria-label="Klasse wählen">
          <span class="grade-switch-label">Klasse</span>
          <div class="grade-switch-buttons" id="klassen-schalter"></div>
        </nav>
      </div>
    </header>

    <section class="hero">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="hero-eyebrow" id="hero-eyebrow">Digitale Schulbücher</p>
          <h1 class="hero-title" id="hero-titel">Alle Bücher. Ein Klick.</h1>
          <p class="hero-text" id="hero-text">Wähle deine Klasse und öffne dein Buch direkt beim Verlag.</p>
        </div>

        <svg class="shelf" viewBox="0 0 240 150" aria-hidden="true">
          <rect x="8" y="38" width="24" height="104" rx="3" fill="#4cc993" />
          <rect x="35" y="54" width="20" height="88" rx="3" fill="#7ea9f4" />
          <rect x="58" y="26" width="28" height="116" rx="3" fill="#f0a95c" />
          <rect x="89" y="46" width="22" height="96" rx="3" fill="#b596ee" />
          <rect x="114" y="34" width="26" height="108" rx="3" fill="#e6ecf1" />
          <rect x="161" y="42" width="22" height="100" rx="3" fill="#7ea9f4" transform="rotate(-12 161 142)" />
          <rect x="190" y="128" width="46" height="14" rx="3" fill="#f0a95c" />
          <rect x="194" y="114" width="40" height="14" rx="3" fill="#4cc993" />
          <g fill="#000" opacity="0.14">
            <rect x="8" y="52" width="24" height="4" />
            <rect x="8" y="122" width="24" height="4" />
            <rect x="58" y="40" width="28" height="5" />
            <rect x="58" y="124" width="28" height="5" />
            <rect x="114" y="48" width="26" height="4" />
            <rect x="122" y="70" width="10" height="34" rx="2" />
            <rect x="89" y="60" width="22" height="3" />
          </g>
          <rect x="0" y="142" width="240" height="6" rx="3" fill="#fff" opacity="0.28" />
        </svg>
      </div>
    </section>

    <main class="main">
      <div class="search" id="suche-box" hidden>
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input
          id="suche"
          type="search"
          placeholder="Fach oder Verlag suchen …"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="search"
          aria-label="Fach oder Verlag suchen"
        />
        <kbd class="search-hint" aria-hidden="true">/</kbd>
      </div>

      <div id="uebersicht" class="grade-cards"></div>
      <div id="inhalt"></div>

      <div role="status">
        <div class="empty" id="keine-treffer" hidden>
          <p class="empty-title">Nichts gefunden</p>
          <p class="empty-text">Für „<span id="suchbegriff"></span>“ gibt es in dieser Klasse kein Buch.</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>
        Die Links führen zu den Online-Ausgaben und Leseproben der Verlage und öffnen sich in einem neuen Tab.
      </p>
    </footer>

    <script>
      // buecher.js wird oft geändert: immer frisch laden statt bis zu 10 Min. aus dem Browser-Cache
      const daten = document.createElement("script");
      daten.src = "buecher.js?t=" + Date.now();
      daten.onload = () => {
        const app = document.createElement("script");
        app.src = "app.js?v=3";
        document.body.append(app);
      };
      document.body.append(daten);
    </script>
  </body>
</html>
